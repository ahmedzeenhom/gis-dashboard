<!DOCTYPE html>
<html lang="ar">
<head>
<style>
html, body {

}
</style>
<meta charset="UTF-8">

<title>Project</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma;
    }

    body {
    height: 100vh;
      opacity: 0;
      animation: pageFade 0.4s ease forwards;
    background:
linear-gradient(
180deg,
#06111f 0%,
#08192b 35%,
#0a2034 60%,
#06111f 100%
);
       background-image:
linear-gradient(
rgba(0,0,0,0.15),
rgba(0,0,0,0.25)
),
url('images/storm-clean.jpg');
       background-position: center center;
       background-size: cover;
       background-repeat: no-repeat;
       background-attachment: fixed;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('images/storm-login.jpg') center center / cover no-repeat;
    filter: blur(8px);
    transform: scale(1.08);
    opacity: 1;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('images/storm-login.jpg') center center / contain no-repeat;
    z-index: 1;
    pointer-events: none;
}

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    .card {
        position: relative;
        background: rgba(10,15,25,0.68);
        backdrop-filter: blur(14px);
        border-radius: 25px;
        padding: 50px;
        width: 420px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 60px rgba(0,255,200,0.2);
        z-index: 2;
    }
.storm-logo{
    width: 42px;
    height: 42px;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(0,255,200,0.45));
    vertical-align: middle;
    margin-left: 10px;
}
    .card h1 {
        font-size: 30px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .card p {
        font-size: 15px;
        line-height: 2;
        opacity: 0.95;
        margin-bottom: 40px;
             font-weight: 600;
    }

    .btn {
        display: inline-block;
        padding: 15px 40px;
        border-radius: 50px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        color: white;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 1px;
        transition: 0.3s;
        box-shadow: 0 0 25px rgba(0,255,200,0.5);
    }

    .btn:hover {
        transform: translateY(-5px) scale(1.07);
        box-shadow: 0 0 45px rgba(0,255,200,0.9);
    }

    /* BRAND */
    .brand {
        margin-top: 25px;
        text-align: center;
        z-index: 2;
    }

    .brand a {
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: 0.3s;
    }

    .brand a:hover {
        filter: drop-shadow(0 0 10px #00f260);
    }

    .brand span {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 5px;
        letter-spacing: 1px;
    }
/* AHMED EDIT - FEATURES */
.features {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 55px;
    z-index: 5;
}

.feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: white;
    font-size: 15px;
    opacity: 0.95;
}

.feature i {
    font-size: 34px;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #00f260, #0575e6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.feature span {
    font-weight: 600;
    margin-top: 6px;
}
/* AHMED FIX - Hide old rain/lightning layers */
.rain,
.lightning {
    display: none !important;
}
/* AHMED EDIT 3 - Use storm image as full landing page */
canvas,
.rain,
.lightning {
    display: none !important;
}.entry-hotspot {
    position: fixed;
    left: 50%;
    top: 61%;
    transform: translate(-50%, -50%);
    width: 310px;
    height: 75px;
    z-index: 999999;
    border-radius: 50px;
}
@keyframes pageFade {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}
/* AHMED LIGHTNING */

.lightning-flash{
    position: fixed;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: screen;
}
</style>
</head>

<body>
<audio id="thunderAudio" preload="auto">
    <source src="sounds/thunder.mp3" type="audio/mpeg">
</audio>
<canvas id="bg"></canvas>
<div class="lightning"></div>
<div class="rain"></div>
<div class="lightning"></div>
<div class="rain"></div>

<div class="card">
    <h1>
    مشروع الخفجي
</h1>

    <p>
        مشروع الدراسات والتصاميم و تخفيض منسوب المياه السطحية
و درء أخطار السيول و شبكة تصريف مياه الأمطار بمحافظة الخفجي
<br>
والمراكز التابعة لها
    </p>

    <a href="map.html?v=20260517-arrows" class="btn">
        الدخول إلى النظام
    </a>
</div>

<div class="brand">
    <a href="#" target="_blank">AHMED ZEEN</a>
    <span>GIS SPECIALIST</span>
</div>

<script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2,
            d: Math.random() * 1
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.globalAlpha = 0.6;

        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });

        update();
    }

    function update() {
        particles.forEach(p => {
            p.y += p.d;
            if (p.y > canvas.height) {
                p.y = 0;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    setInterval(draw, 30);
</script>
<div class="features">

        <div class="feature">
        <i class="fa-solid fa-cloud-rain"></i>
        <span style="margin-top:10px;">تصريف مياه الأمطار</span>
    </div>

    <div class="feature">
        <i class="fa-solid fa-shield-halved"></i>
        <span>درء أخطار السيول</span>
    </div>

    <div class="feature">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
        <span>شبكات التصريف</span>
    </div>
<div class="feature">
    <i class="fa-solid fa-water"></i>
    <span>تخفيض الجريان السطحي</span>
</div>

</div>

<div class="lightning-flash"></div>
<script>

const flash = document.querySelector(".lightning-flash");
const thunder = document.getElementById("thunderAudio");

let soundEnabled = false;
setTimeout(() => {
    lightningEffect();
}, 900);

document.body.addEventListener("click", () => {
    soundEnabled = true;
    thunder.volume = 0.18;
    thunder.currentTime = 0;
    thunder.play().catch(() => {});
});

function lightningEffect(){

    flash.style.transition = "none";
    flash.style.opacity = "0.22";

    setTimeout(() => {
        flash.style.transition = "opacity 0.5s ease";
        flash.style.opacity = "0";
    }, 80);

    if(soundEnabled){

        thunder.volume = 0.18;

        thunder.currentTime = 0;

        setTimeout(() => {
    thunder.play().catch(() => {});
}, 120);
    }
}

setInterval(() => {

    const random = Math.random();

    if(random > 0.72){
        lightningEffect();
    }

}, 4000);

</script>
</body>
</html>
