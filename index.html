/* ===== AHMED MARK 14: بداية JavaScript - وظائف الخريطة ===== */

/* ===== AHMED MARK 15: إعداد الخريطة ومكان البداية ===== */

const map = L.map('map', {

}).setView([28.4,48.5],13);
const imagery = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
{
  noWrap:true,
  bounds:[[-85,-180],[85,180]]
}
).addTo(map);/* ===== AHMED EDIT 38-A: خلفية فاضية لإخفاء الصورة الجوية ===== */
/* ===== AHMED EDIT 36-A: إضافة طبقة Hillshade من XYZ Tiles ===== */
/* ===== AHMED EDIT 37: منع اختفاء Hillshade بعد مستوى الزووم المتاح ===== */

const hillshadeLayer = L.tileLayer(
  'tiles/{z}/{x}/{y}.png',
  {

    maxNativeZoom: 17,
    maxZoom: 20
  }
);

// ===== AHMED EDIT 39: DEM Layer =====
const demLayer = L.tileLayer(
  'https://ahmedzeenhom.github.io/gis-dashboard/dem/{z}/{x}/{y}.png',
  {
    attribution: 'DEM',
    opacity: 0.65,
    maxZoom: 20,
    maxNativeZoom: 16
  }
);
// ===== AHMED EDIT 56-A: DEM disabled on startup =====
// demLayer.addTo(map);// ===== AHMED EDIT 40: Keep DEM above Hillshade =====
demLayer.bringToFront();
;/* ===== AHMED MARK 16: أماكن تخزين بيانات الطبقات بعد التحميل ===== */
/* ================= DATA ================= */
let K=[],N=[],P=[],E=[],D=[],B=[];

/* ===== AHMED MARK 17: تعريف طبقات الخريطة ===== */
/* ================= LAYERS ================= */
let landLayer=L.geoJSON(null).addTo(map);
// ===== AHMED EDIT 46-B: Districts Layer with Arabic Labels =====
let districtLayer = L.geoJSON(null, {
 style: {
  color: "#9ca3af",
  weight: 1,
  fillColor: "#000000",
  fillOpacity: 0,
  opacity: 0
},
  onEachFeature: function (f, l) {
    const p = f.properties || {};
  // ===== AHMED EDIT 46-H: Hide district label if ArabicName is empty =====
// ===== AHMED EDIT 46-J: Treat empty / بدون اسم as no label =====
const rawDistrictName = (p.ArabicName || "").trim();
// ===== AHMED EDIT 46-L: Hide الحرس الوطني district =====
if(rawDistrictName === "الحرس الوطني"){
    return;
}

const nameAr = rawDistrictName === "بدون اسم" ? "" : rawDistrictName;

if(nameAr){
  l.bindTooltip(nameAr, {
    permanent: false,
    direction: "center",
    className: "district-label"
  });

}

    l.bindPopup(`
      <div style="direction:rtl;text-align:right;min-width:180px">
        <h3 style="margin:0 0 8px;color:#0f172a">بيانات الحي</h3>
        <div><b>اسم الحي:</b> ${nameAr || "غير معروف"}</div>
      </div>
    `);
  }
});
// ===== AHMED EDIT 46-I: Show Districts by default =====
districtLayer.addTo(map);
// ===== AHMED EDIT 50-A: Districts visible only after zoom in =====
const districtsMinVisibleZoom = 13;

function updateDistrictsVisibilityByZoom(){
  if(map.getZoom() >= districtsMinVisibleZoom){
    districtLayer.setStyle({
  color: "#9ca3af",
  weight: 1,
  fillColor: "#000000",
  fillOpacity: 0,
  opacity: 0.45
});
    districtLayer.eachLayer(function(layer){
      if(layer.getTooltip()){
        layer.openTooltip();
      }
    });
  } else {
    districtLayer.setStyle({
      opacity: 0,
      fillOpacity: 0
    });
    districtLayer.eachLayer(function(layer){
      if(layer.getTooltip()){
        layer.closeTooltip();
      }
    });
  }
}

map.on("zoomend", updateDistrictsVisibilityByZoom);
// ===== AHMED EDIT 48-G: Clean Boundary Layer =====
let boundaryLayer = L.geoJSON(null,{
  interactive:false,
  style:function(){
    return{
      color:"#ffffff",
      weight:2,
      fillOpacity:0,
      opacity:1
    };
  }
});

boundaryLayer.addTo(map);
// ===== AHMED EDIT 48-B: Al Khafji boundary layer =====
/* ===== AHMED EDIT 04: Popups للشبكات وخطوط الطرد ومحطات الرفع ===== */
// ===== AHMED EDIT 51-A: Roads Layer =====
// ===== AHMED EDIT 53-A: Engineering Solutions layers =====
const solutionLayers = L.layerGroup().addTo(map);

function solutionStyle(id){
  const styles = {
    1: "#2563eb",
    2: "#ef4444",
    3: "#f59e0b",
    4: "#22c55e"
  };

  return {

    opacity: 1,
    dashArray: "8,8"
  };
}
let roadsLayer = L.geoJSON(null,{
  style:function(){
    return{
      color:"#1a1a1a",
           weight:1.4,
           fillColor:"#6b7280",
           fillOpacity:0.88,
           opacity:1
    };
  }
});
// ===== AHMED EDIT 51-D: Show Roads by default =====
roadsLayer.addTo(map);
// ===== AHMED EDIT 55-A: Network colors by NO =====
function networkColor(no){
  no = String(no || "").trim();

  const colors = {
  "1": "#2563eb", // أزرق
  "2": "#ef4444", // أحمر
  "3": "#ffffff", // أبيض
  "4": "#22c55e", // أخضر

  "6": "#a855f7", // بنفسجي
  "7": "#fb923c"  // برتقالي
};

  return colors[no] || "#38bdf8";
}
let networkLayer=L.geoJSON(null,{
style:function(f){

  return {

    opacity: 1
  };
},
onEachFeature:function(f,l){

</div>
`);

}
}).addTo(map);


let pressureLayer=L.geoJSON(null,{
style:{color:"#000",weight:3,opacity:1,dashArray:"10 8"},
onEachFeature:function(f,l){

</div>
`);

}

/* ===== AHMED EDIT 17: تلوين محطات الرفع حسب الحالة ===== */
function electricColor(status){
status = String(status || "").trim();

if(status === "1"){
    return "#22c55e"; // قائمة - أخضر
}

if(status === "3"){
    return "#ef4444"; // مقترحة - أحمر
}

return "#38bdf8"; // غير معروف - أزرق
}

let electricLayer=L.geoJSON(null,{
style:function(f){
let status = f.properties ? f.properties.StructureStatus : "";

return {
color:electricColor(status),
fillColor:electricColor(status),
weight:3,
fillOpacity:0.65
};
},

pointToLayer:function(f,latlng){
let status = f.properties ? f.properties.StructureStatus : "";

return L.circleMarker(latlng,{
radius:9,
color:electricColor(status),
fillColor:electricColor(status),
weight:3,
fillOpacity:0.9
});
},

onEachFeature:function(f,l){

let p=f.properties || {};

let statusText="غير معروف";

if(String(status)==="1"){
statusText="🟢 قائمة";

</div>
`);

}

v=String(v||"").trim();

/* أي قيمة فيها كلمة سكن تعتبر سكني، مثل: سكني عامة */
if(v.includes("سكن")) return "#facc15";

return "#64748b";
}

  const layers = [

  ];

  layers.forEach(function(layer){

      map.removeLayer(layer);
    }
  });
window.allLayersHidden = true;
document.getElementById("toggleAllLayersBtn").innerText = "إظهار الطبقات";
return;
}

}
