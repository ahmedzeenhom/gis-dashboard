<script>

/* ===== AHMED MARK 14: بداية JavaScript - وظائف الخريطة ===== */

/* ===== AHMED MARK 15: إعداد الخريطة ومكان البداية ===== */
/* ================= MAP ================= */
const map = L.map('map').setView([28.4,48.5],13);

const imagery = L.tileLayer(
'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
).addTo(map);
/* ===== AHMED EDIT 38-A: خلفية فاضية لإخفاء الصورة الجوية ===== */
/* ===== AHMED EDIT 36-A: إضافة طبقة Hillshade من XYZ Tiles ===== */
/* ===== AHMED EDIT 37: منع اختفاء Hillshade بعد مستوى الزووم المتاح ===== */
/* ===== AHMED EDIT 37: Hillshade Tiles بجودة أعلى حتى زووم 17 ===== */
// ===== AHMED EDIT 37: Hillshade Tiles =====
const hillshadeLayer = L.tileLayer(
  'tiles/{z}/{x}/{y}.png',
  {
    opacity: 0.45,
    attribution: 'Hillshade',
    minZoom: 10,
    maxNativeZoom: 17,
    maxZoom: 20
  }
);

// ===== AHMED EDIT 39: DEM Layer =====
const demLayer = L.tileLayer(
  'https://ahmedzeenhom.github.io/gis-dashboard/dem/{z}/{x}/{y}.png',
  {
    attribution: 'DEM',
    opacity: 0.65,
    maxZoom: 16,
    maxNativeZoom: 16
  }
);
// ===== AHMED EDIT 39-A: Show DEM Layer On Map =====
demLayer.addTo(map);
// ===== AHMED EDIT 40: Keep DEM above Hillshade =====
demLayer.bringToFront();
;/* ===== AHMED MARK 16: أماكن تخزين بيانات الطبقات بعد التحميل ===== */
/* ================= DATA ================= */
let K=[],N=[],P=[],E=[];

/* ===== AHMED MARK 17: تعريف طبقات الخريطة ===== */
/* ================= LAYERS ================= */
let landLayer=L.geoJSON(null).addTo(map);
/* ===== AHMED EDIT 04: Popups للشبكات وخطوط الطرد ومحطات الرفع ===== */

let networkLayer=L.geoJSON(null,{
style:{color:"#ff0000",weight:2},
onEachFeature:function(f,l){

let p=f.properties || {};
let no=p.NO || "غير معروف";

l.bindPopup(`
<div style="direction:rtl;text-align:right;min-width:200px">
    <h3 style="margin:0 0 8px;color:#0f172a">بيانات الشبكة</h3>
    <div><b>رقم الشبكة:</b> ${no}</div>
</div>
`);

}
}).addTo(map);


let pressureLayer=L.geoJSON(null,{
style:{color:"#000",weight:2},
onEachFeature:function(f,l){

let p=f.properties || {};
let des=p.des || "غير معروف";

l.bindPopup(`
<div style="direction:rtl;text-align:right;min-width:200px">
    <h3 style="margin:0 0 8px;color:#0f172a">بيانات خط الطرد</h3>
    <div><b>الوصف:</b> ${des}</div>
</div>
`);

}
}).addTo(map);


/* ===== AHMED EDIT 17: تلوين محطات الرفع حسب الحالة ===== */
function electricColor(status){
status = String(status || "").trim();

if(status === "1"){
    return "#22c55e"; // قائمة - أخضر
}

if(status === "3"){
    return "#ef4444"; // مقترحة - أحمر
}

return "#38bdf8"; // غير معروف - أزرق
}

let electricLayer=L.geoJSON(null,{
style:function(f){
let status = f.properties ? f.properties.StructureStatus : "";

return {
color:electricColor(status),
fillColor:electricColor(status),
weight:3,
fillOpacity:0.65
};
},

pointToLayer:function(f,latlng){
let status = f.properties ? f.properties.StructureStatus : "";

return L.circleMarker(latlng,{
radius:9,
color:electricColor(status),
fillColor:electricColor(status),
weight:3,
fillOpacity:0.9
});
},

onEachFeature:function(f,l){

let p=f.properties || {};
let status=p.StructureStatus || "غير معروف";

let statusText="غير معروف";

if(String(status)==="1"){
statusText="🟢 قائمة";
}

if(String(status)==="3"){
statusText="🔴 مقترحة";
}

l.bindPopup(`
<div style="direction:rtl;text-align:right;min-width:200px">
    <h3 style="margin:0 0 8px;color:#0f172a">بيانات محطة الرفع</h3>
    <div><b>الحالة:</b> ${statusText}</div>
</div>
`);

}
}).addTo(map);
/* ===== AHMED MARK 18: ألوان استخدامات الأراضي ===== */
/* ================= COLORS ================= */
/* ===== AHMED EDIT 10: تحسين تصنيف ألوان استخدامات الأراضي ===== */
function color(v){
v=String(v||"").trim();

/* أي قيمة فيها كلمة سكن تعتبر سكني، مثل: سكني عامة */
if(v.includes("سكن")) return "#facc15";

if(v.includes("تجار")) return "#ef4444";
if(v.includes("صناع")) return "#a855f7";
if(v.includes("خدم")) return "#38bdf8";
if(v.includes("مرافق") || v.includes("المرافق")) return "#22c55e";

return "#64748b";
}

/* ===== AHMED MARK 19: شكل أيقونات محطات الرفع ===== */
/* ================= ELECTRIC ICON ================= */
function pin(status){
let ok=String(status)==="1";
let c=ok?"#00ff6a":"#ff1744";

return L.divIcon({
html:`
<div style="position:relative">
<div style="
width:56px;height:56px;
background:${c};
border-radius:50% 50% 50% 0;
transform:rotate(-45deg);
border:5px solid white;
box-shadow:0 10px 20px rgba(0,0,0,0.6);
"></div>
<div style="
position:absolute;
top:20px;left:20px;
width:14px;height:14px;
background:white;
border-radius:50%;
"></div>
</div>
`,
iconSize:[56,56],
iconAnchor:[28,56]
});
}

/* ===== AHMED MARK 20: رسم طبقة استخدامات الأراضي ===== */
/* ================= SAFE RENDER ================= */
function renderLand(data){
landLayer.clearLayers();

landLayer.addData({
type:"FeatureCollection",
features:data
});
/* ===== AHMED EDIT 05: دالة الرجوع لحدود المشروع ===== */
/* ===== AHMED EDIT 14: إصلاح زر الرجوع لحدود المشروع بطريقة أقوى ===== */
function zoomToProject(){

let bounds = null;

try{
    if(K && K.length > 0){
        bounds = L.geoJSON({
            type:"FeatureCollection",
            features:K
        }).getBounds();
    }
}catch(e){
    console.log("Zoom bounds error:", e);
}

if(bounds && bounds.isValid()){
    map.fitBounds(bounds,{
        padding:[40,40],
        maxZoom:16
    });
}else{
    alert("حدود المشروع لم يتم تحميلها بعد. انتظر ثواني وجرب مرة أخرى.");
}

}landLayer.eachLayer(function(layer){

let useValue = layer.feature.properties.USE || "غير معروف";

/* ===== AHMED EDIT 07: Popup أوضح لمعرفة سبب القطع غير الملونة ===== */
layer.bindPopup(`
<div style="direction:rtl;text-align:right;min-width:220px">
    <h3 style="margin:0 0 8px;color:#0f172a">بيانات قطعة الأرض</h3>
    <div><b>الاستخدام:</b> ${useValue}</div>
    <hr>
    <div style="font-size:12px;color:#334155">
        لو القطعة المفروض سكني لكن مش صفراء، ابعتلي قيمة الاستخدام الظاهرة هنا.
    </div>
</div>
`);
layer.on("mouseover", function(){
layer.setStyle({
weight:3,
color:"#ffffff",
fillOpacity:0.9
});
});

layer.on("mouseout", function(){
/* ===== AHMED EDIT 16: منع رجوع القطع للشكل الأزرق الافتراضي ===== */
layer.setStyle({
fillColor:color(layer.feature.properties.USE),
color:"#111",
weight:1,
fillOpacity:0.6
});
});

});

landLayer.setStyle(f=>({
fillColor:color(f.properties.USE),
color:"#111",
weight:1,
fillOpacity:0.6
}));
}

/* ===== AHMED MARK 21: محتوى القائمة الجانبية والفلاتر ===== */
/* ================= UNBREAKABLE UI BUILDER ================= */
function buildUI(){

document.getElementById("sidebar").innerHTML = `

<div class="section-header">
<h3>استخدامات الاراضي</h3>
<select id="useFilter" onchange="filterUSE()">
<option value="all">All</option>
<option>سكني</option>
<option>تجاري</option>
<option>صناعي</option>
<option>خدمات</option>
<option>المرافق</option>
</select>
</div>

<div class="section-header">
<h3>الشبكات</h3>
<select id="networkFilter" onchange="filterNetwork(this.value)">
<option value="all">All</option>
</select>
</div>

<div class="section-header">
<h3>خطوط الطرد</h3>
<select id="pressureFilter" onchange="filterPressure(this.value)">
<option value="all">All</option>
</select>
</div>

<div class="section-header">
<h3>محطات الرفع</h3>
<select id="electricFilter" onchange="filterElectric(this.value)">
<option value="all">All</option>
<option value="1">🟢 قائمة</option>
<option value="3">🔴 مقترحة</option>
</select>
</div>

<div class="section-header">
<h3>السطوع والتباين</h3>
<input type="range" id="b" min="50" max="150" value="100">
<input type="range" id="c" min="50" max="150" value="100">
</div>

`;
}

/* ===== AHMED MARK 22: وظائف الفلاتر ===== */
/* ================= SAFE FILTERS ================= */
function filterUSE(){
let v=useFilter.value;
renderLand(v==="all"?K:K.filter(x=>String(x.properties.USE).includes(v)));
}

function filterNetwork(v){
networkLayer.clearLayers();
networkLayer.addData({
type:"FeatureCollection",
features: v==="all"?N:N.filter(x=>String(x.properties.NO)==v)
});
}

function filterPressure(v){
pressureLayer.clearLayers();
pressureLayer.addData({
type:"FeatureCollection",
features: v==="all"?P:P.filter(x=>String(x.properties.des)==v)
});
}

/* ===== AHMED EDIT 18: فلتر محطات الرفع مع الحفاظ على الألوان ===== */
function filterElectric(v){
electricLayer.clearLayers();

electricLayer.addData({
type:"FeatureCollection",
features: v==="all"?E:E.filter(x=>String(x.properties.StructureStatus)==v)
});
}
/* ===== AHMED MARK 23: تعبئة القوائم تلقائي من البيانات ===== */
/* ================= DROPDOWN AUTO FIX ================= */
function buildDropdowns(){

networkFilter.innerHTML=`<option value="all">All</option>`;
[...new Set(N.map(x=>x.properties.NO))].forEach(v=>{
networkFilter.innerHTML+=`<option value="${v}">${v}</option>`;
});

pressureFilter.innerHTML=`<option value="all">All</option>`;
[...new Set(P.map(x=>x.properties.des))].forEach(v=>{
pressureFilter.innerHTML+=`<option value="${v}">${v}</option>`;
});
}

/* ===== AHMED MARK 24: السطوع والتباين ===== */
/* ================= BRIGHTNESS SAFE ================= */
function bindBrightness(){

function update(){
document.querySelector(".leaflet-tile-pane").style.filter=
`brightness(${b.value}%) contrast(${c.value}%)`;
}

b.oninput=update;
c.oninput=update;
}

/* ===== AHMED MARK 25: تحميل ملفات البيانات من فولدر data ===== */
/* ================= LOAD DATA ================= */
fetch('data/alkhafje.geojson')
.then(r=>r.json())
.then(d=>{
K=d.features;
renderLand(K);
map.fitBounds(landLayer.getBounds());
});

fetch('data/alkhafje-network.json')
.then(r=>r.json())
.then(d=>{
N=d.features;
networkLayer.addData(d);
buildDropdowns();
});

fetch('data/pressure_line.geojson')
.then(r=>r.json())
.then(d=>{
P=d.features;
pressureLayer.addData(d);
buildDropdowns();
});

fetch('data/electric.geojson')
.then(r=>r.json())
.then(d=>{
E=d.features;
electricLayer.addData({
type:"FeatureCollection",
features:E
});
});
