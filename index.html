<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma;
    }

    body {
        height: 100vh;
        background: #0a0f1c;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    .card {
        position: relative;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(25px);
        border-radius: 25px;
        padding: 50px;
        width: 420px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 60px rgba(0,255,200,0.2);
        z-index: 2;
    }

    .card h1 {
        font-size: 30px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .card p {
        font-size: 14px;
        line-height: 2;
        opacity: 0.85;
        margin-bottom: 40px;
    }

    .btn {
        display: inline-block;
        padding: 15px 40px;
        border-radius: 50px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        color: white;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 1px;
        transition: 0.3s;
        box-shadow: 0 0 25px rgba(0,255,200,0.5);
    }

    .btn:hover {
        transform: translateY(-5px) scale(1.07);
        box-shadow: 0 0 45px rgba(0,255,200,0.9);
    }

    /* BRAND */
    .brand {
        margin-top: 25px;
        text-align: center;
        z-index: 2;
    }

    .brand a {
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: 0.3s;
    }

    .brand a:hover {
        filter: drop-shadow(0 0 10px #00f260);
    }

    .brand span {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 5px;
        letter-spacing: 1px;
    }

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="card">
    <h1>🚀 مشروع</h1>

    <p>
        مشروع دراسات والتصاميم و تخفيض منسوب المياه السطحية و درء أخطار السيول 
        و شبكة تصريف مياه الأمطار بمحافظة الخفجي و المراكز التابعة لها
    </p>

    <a href="map.html" class="btn">
        الدخول إلى النظام
    </a>
</div>

<div class="brand">
    <a href="#" target="_blank">AHMED ZEEN</a>
    <span>GIS SPECIALIST</span>
</div>

<script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2,
            d: Math.random() * 1
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.globalAlpha = 0.6;

        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });

        update();
    }

    function update() {
        particles.forEach(p => {
            p.y += p.d;
            if (p.y > canvas.height) {
                p.y = 0;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    setInterval(draw, 30);
</script>

</body>
</html>
