<!DOCTYPE html>

<head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma;
    }

    body {
    height: 100vh;
    background: url('images/storm-clean.jpg') center center / cover no-repeat fixed;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: url('images/storm-login.jpg') center center / cover no-repeat;
    filter: blur(8px);
    transform: scale(1.08);
    opacity: 1;
    z-index: 0;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: url('images/storm-login.jpg') center center / contain no-repeat;
    z-index: 1;
    pointer-events: none;
}

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    .card {
        position: relative;
        background: rgba(10,15,25,0.68);
        backdrop-filter: blur(14px);
        border-radius: 25px;
        padding: 50px;
        width: 420px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 60px rgba(0,255,200,0.2);
        z-index: 2;
    }

    .card h1 {
        font-size: 30px;
        margin-bottom: 20px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .card p {
        font-size: 14px;
        line-height: 2;
        opacity: 0.85;
        margin-bottom: 40px;
    }

    .btn {
        display: inline-block;
        padding: 15px 40px;
        border-radius: 50px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        color: white;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 1px;
        transition: 0.3s;
        box-shadow: 0 0 25px rgba(0,255,200,0.5);
    }

    .btn:hover {
        transform: translateY(-5px) scale(1.07);
        box-shadow: 0 0 45px rgba(0,255,200,0.9);
    }

    /* BRAND */
    .brand {
        margin-top: 25px;
        text-align: center;
        z-index: 2;
    }

    .brand a {
        text-decoration: none;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #00f260, #0575e6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        transition: 0.3s;
    }

    .brand a:hover {
        filter: drop-shadow(0 0 10px #00f260);
    }

    .brand span {
        display: block;
        font-size: 12px;
        opacity: 0.6;
        margin-top: 5px;
        letter-spacing: 1px;
    }
/* AHMED FIX 2 - Real Rain + Lightning */
/* AHMED FIX 3 - Hide bad rain overlay */
.rain {
    display: none;
}
    position: fixed;
    inset: -120px 0 0 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.45;
    background-image:
        repeating-linear-gradient(
            105deg,
            rgba(255,255,255,0.35) 0px,
            rgba(255,255,255,0.35) 1px,
            transparent 1px,
            transparent 18px
        );
    background-size: 18px 120px;
    animation: rainFall 0.35s linear infinite;
}

.lightning {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: radial-gradient(circle at 25% 15%, rgba(180,220,255,0.75), transparent 35%);
    opacity: 0;
    animation: lightningFlash 5s infinite;
}

@keyframes rainFall {
    from {
        transform: translate3d(0, -120px, 0);
    }
    to {
        transform: translate3d(-40px, 120px, 0);
    }
}

@keyframes lightningFlash {
    0%, 88%, 100% { opacity: 0; }
    89% { opacity: 0.9; }
    90% { opacity: 0.05; }
    91% { opacity: 0.65; }
    92% { opacity: 0; }
}
/* AHMED EDIT 3 - Use storm image as full landing page */
canvas,
.rain,
.lightning {

<body>

<canvas id="bg"></canvas>

<div class="card">
    <h1>⛈️ مشروع الخفجي لتصريف الأمطار</h1>

    <p>

        و شبكة تصريف مياه الأمطار بمحافظة الخفجي و المراكز التابعة لها
    </p>

    </a>

    <span>GIS SPECIALIST</span>
</div>

<script>
    const canvas = document.getElementById("bg");
    const ctx = canvas.getContext("2d");

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2,
            d: Math.random() * 1
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.globalAlpha = 0.6;

        particles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
        });

        update();
    }

    function update() {
        particles.forEach(p => {
            p.y += p.d;
            if (p.y > canvas.height) {
                p.y = 0;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    setInterval(draw, 30);
</script>

</body>
